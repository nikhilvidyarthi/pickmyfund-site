name: Update market data

on:
  schedule:
    # GitHub cron is in UTC. 03:50–09:50 UTC = 9:20 am–3:20 pm IST, hourly, Mon–Fri
    - cron: "50 3-9 * * 1-5"
    # 10:15 UTC = 3:45 pm IST, closing numbers
    - cron: "15 10 * * 1-5"
    # 11:45 UTC = 5:15 pm IST, after the government bond market closes at 5 pm
    - cron: "45 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/update_data.py
      - name: Commit if the data changed
        run: |
          if git diff --quiet site/data.json data/nse_index_eod.csv; then echo "No change"; exit 0; fi
          git config user.name "pickmyfund-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json data/nse_index_eod.csv
          git commit -m "Update market data $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')"
          git push
