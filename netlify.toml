# The site is plain HTML: no build step, publish the site/ folder as it is.
[build]
  publish = "site"
  command = "echo 'static site, nothing to build'"

[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/perf-a27fdda57c/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
